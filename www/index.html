<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#131314">
<title>Minelium AI</title>
<style>html,body{height:100%;margin:0;background:#131314}</style>
</head>
<body>
<script>
/* محمّل التطبيق: يجيب آخر نسخة من الواجهة من GitHub Pages، وإذا ما كو إنترنت يستعمل آخر نسخة محفوظة، وإذا ما كو يستعمل النسخة اللي داخل التطبيق */
(function(){
  var REMOTE='https://abode20asa-rgb.github.io/minelium-ai-app/www/app.html', KEY='minelium_ui';
  function run(h){ document.open(); document.write(h); document.close(); }
  function fallback(){
    var h=null; try{ h=localStorage.getItem(KEY); }catch(e){}
    if(h) run(h); else location.replace('app.html');
  }
  var ac=window.AbortController?new AbortController():null;
  var t=setTimeout(function(){ if(ac) ac.abort(); },3500);
  fetch(REMOTE+'?t='+Date.now(),{cache:'no-store',signal:ac?ac.signal:undefined})
    .then(function(r){ if(!r.ok) throw new Error('http'); return r.text(); })
    .then(function(h){
      clearTimeout(t);
      if(h.indexOf('minelium_token')<0||h.indexOf('APP_CONFIG')<0) throw new Error('bad');
      try{ localStorage.setItem(KEY,h); }catch(e){}
      run(h);
    })
    .catch(function(){ clearTimeout(t); fallback(); });
})();
</script>
</body>
</html>
