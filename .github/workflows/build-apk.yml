name: Build APK
on:
  workflow_dispatch: {}
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install
      - run: npx cap add android
      - name: إعداد Firebase للإشعارات (ملف google-services.json بجذر المستودع)
        run: |
          if [ -f google-services.json ]; then cp google-services.json android/app/google-services.json; echo "firebase ready"; else echo "no google-services.json - push disabled"; fi
      - name: السماح برجوع تسجيل Google والمايك للمكالمة الصوتية
        run: |
          python3 - <<'PY'
          p='android/app/src/main/AndroidManifest.xml'
          s=open(p,encoding='utf-8').read()
          f='<intent-filter><action android:name="android.intent.action.VIEW" /><category android:name="android.intent.category.DEFAULT" /><category android:name="android.intent.category.BROWSABLE" /><data android:scheme="minelium" android:host="auth" /></intent-filter>\n'
          assert '</activity>' in s
          if 'android:scheme="minelium"' not in s:
              s=s.replace('</activity>', f+'</activity>', 1)
          for pm in ('android.permission.RECORD_AUDIO','android.permission.MODIFY_AUDIO_SETTINGS','android.permission.POST_NOTIFICATIONS','android.permission.WRITE_EXTERNAL_STORAGE'):
              if pm not in s:
                  s=s.replace('<application','<uses-permission android:name="'+pm+'" />\n    <application',1)
          open(p,'w',encoding='utf-8').write(s)
          print('manifest patched')
          PY
      - run: npx --yes @capacitor/assets@3 generate --android --assetPath assets/assets
      - run: npx cap sync android
      - name: توقيع ثابت (حتى يتحدّث التطبيق فوق القديم)
        env:
          KS: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS" ]; then mkdir -p ~/.android && echo "$KS" | base64 -d > ~/.android/debug.keystore; echo "fixed key"; else echo "no key secret - random key"; fi
      - run: chmod +x android/gradlew && cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: minelium-ai-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
